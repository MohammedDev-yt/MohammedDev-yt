<svg xmlns="http://www.w3.org/2000/svg"
     width="850"
     height="240"
     viewBox="0 0 850 240">

  <defs>

    <!-- Card background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1623"/>
      <stop offset="50%" stop-color="#0c1421"/>
      <stop offset="100%" stop-color="#080e19"/>
    </linearGradient>

    <!-- Soft glow -->
    <filter id="softGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Animated accent -->
    <linearGradient id="accent">
      <stop offset="0%" stop-color="#00d4ff">
        <animate attributeName="stop-color"
                 values="#00d4ff;#a78bfa;#ffb020;#00d4ff"
                 dur="8s"
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a78bfa">
        <animate attributeName="stop-color"
                 values="#a78bfa;#ffb020;#00d4ff;#a78bfa"
                 dur="8s"
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>

  </defs>


  <!-- ============================== -->
  <!-- CARD -->
  <!-- ============================== -->

  <rect x="0.5"
        y="0.5"
        width="849"
        height="239"
        rx="12"
        fill="url(#cardBg)"
        stroke="#1a2332"
        stroke-width="1"/>


  <!-- ============================== -->
  <!-- TITLES -->
  <!-- ============================== -->

  <text x="30"
        y="38"
        fill="#64748b"
        font-size="11"
        font-family="monospace"
        letter-spacing="3">
    LANGUAGE TELEMETRY
  </text>

  <text x="460"
        y="38"
        fill="#64748b"
        font-size="11"
        font-family="monospace"
        letter-spacing="3">
    FOCUS SECTORS
  </text>


  <!-- animated top accents -->

  <rect x="30"
        y="47"
        width="365"
        height="1"
        fill="url(#accent)"
        opacity=".35"/>

  <rect x="460"
        y="47"
        width="330"
        height="1"
        fill="url(#accent)"
        opacity=".35"/>


  <!-- ============================== -->
  <!-- CENTER DIVIDER -->
  <!-- ============================== -->

  <line x1="425"
        y1="25"
        x2="425"
        y2="215"
        stroke="#1a2332"
        stroke-width="1"
        opacity=".5"/>


  <!-- ============================== -->
  <!-- PYTHON -->
  <!-- ============================== -->

  <g transform="translate(30 65)">

    <text x="0"
          y="0"
          fill="#94a3b8"
          font-size="11"
          font-family="sans-serif"
          dominant-baseline="middle">
      Python
    </text>

    <rect x="110"
          y="-6"
          width="0"
          height="12"
          rx="3"
          fill="#3572A5"
          opacity=".9">

      <animate attributeName="width"
               from="0"
               to="105"
               dur=".8s"
               begin="0s"
               fill="freeze"/>

    </rect>

    <text x="320"
          y="0"
          fill="#64748b"
          font-size="10"
          font-family="monospace"
          dominant-baseline="middle">
      42.0%
    </text>

  </g>


  <!-- ============================== -->
  <!-- HTML5 -->
  <!-- ============================== -->

  <g transform="translate(30 87)">

    <text x="0"
          y="0"
          fill="#94a3b8"
          font-size="11"
          font-family="sans-serif"
          dominant-baseline="middle">
      HTML5
    </text>

    <rect x="110"
          y="-6"
          width="0"
          height="12"
          rx="3"
          fill="#e34c26"
          opacity=".9">

      <animate attributeName="width"
               from="0"
               to="70"
               dur=".8s"
               begin=".1s"
               fill="freeze"/>

    </rect>

    <text x="320"
          y="0"
          fill="#64748b"
          font-size="10"
          font-family="monospace"
          dominant-baseline="middle">
      28.0%
    </text>

  </g>


  <!-- ============================== -->
  <!-- CSS -->
  <!-- ============================== -->

  <g transform="translate(30 109)">

    <text x="0"
          y="0"
          fill="#94a3b8"
          font-size="11"
          font-family="sans-serif"
          dominant-baseline="middle">
      CSS
    </text>

    <rect x="110"
          y="-6"
          width="0"
          height="12"
          rx="3"
          fill="#563d7c"
          opacity=".9">

      <animate attributeName="width"
               from="0"
               to="45"
               dur=".8s"
               begin=".2s"
               fill="freeze"/>

    </rect>

    <text x="320"
          y="0"
          fill="#64748b"
          font-size="10"
          font-family="monospace"
          dominant-baseline="middle">
      18.0%
    </text>

  </g>


  <!-- ============================== -->
  <!-- C -->
  <!-- ============================== -->

  <g transform="translate(30 131)">

    <text x="0"
          y="0"
          fill="#94a3b8"
          font-size="11"
          font-family="sans-serif"
          dominant-baseline="middle">
      C
    </text>

    <rect x="110"
          y="-6"
          width="0"
          height="12"
          rx="3"
          fill="#555555"
          opacity=".9">

      <animate attributeName="width"
               from="0"
               to="20"
               dur=".8s"
               begin=".3s"
               fill="freeze"/>

    </rect>

    <text x="320"
          y="0"
          fill="#64748b"
          font-size="10"
          font-family="monospace"
          dominant-baseline="middle">
      8.0%
    </text>

  </g>


  <!-- ============================== -->
  <!-- DOCKER -->
  <!-- ============================== -->

  <g transform="translate(30 153)">

    <text x="0"
          y="0"
          fill="#94a3b8"
          font-size="11"
          font-family="sans-serif"
          dominant-baseline="middle">
      Docker
    </text>

    <rect x="110"
          y="-6"
          width="0"
          height="12"
          rx="3"
          fill="#2496ED"
          opacity=".9">

      <animate attributeName="width"
               from="0"
               to="10"
               dur=".8s"
               begin=".4s"
               fill="freeze"/>

    </rect>

    <text x="320"
          y="0"
          fill="#64748b"
          font-size="10"
          font-family="monospace"
          dominant-baseline="middle">
      4.0%
    </text>

  </g>


  <!-- ============================== -->
  <!-- GIT -->
  <!-- ============================== -->

  <g transform="translate(30 175)">

    <text x="0"
          y="0"
          fill="#94a3b8"
          font-size="11"
          font-family="sans-serif"
          dominant-baseline="middle">
      Git
    </text>

    <rect x="110"
          y="-6"
          width="0"
          height="12"
          rx="3"
          fill="#F05032"
          opacity=".9">

      <animate attributeName="width"
               from="0"
               to="7.5"
               dur=".8s"
               begin=".5s"
               fill="freeze"/>

    </rect>

    <text x="320"
          y="0"
          fill="#64748b"
          font-size="10"
          font-family="monospace"
          dominant-baseline="middle">
      3.0%
    </text>

  </g>


  <!-- ============================== -->
  <!-- FOCUS RADAR -->
  <!-- ============================== -->

  <g>

    <!-- radar rings -->

    <circle cx="637"
            cy="140"
            r="22"
            fill="none"
            stroke="#64748b"
            stroke-width=".5"
            stroke-dasharray="3 3"
            opacity=".3"/>

    <circle cx="637"
            cy="140"
            r="44"
            fill="none"
            stroke="#64748b"
            stroke-width=".5"
            stroke-dasharray="3 3"
            opacity=".3"/>

    <circle cx="637"
            cy="140"
            r="65"
            fill="none"
            stroke="#64748b"
            stroke-width=".5"
            stroke-dasharray="3 3"
            opacity=".3"/>


    <!-- sector: DevOps -->

    <path d="
      M637 140
      L580.7 172.5
      A65 65 0 0 1 637 75
      Z"
      fill="#ffb020"
      fill-opacity=".10"
      stroke="#ffb020"
      stroke-opacity=".3"
      stroke-width=".5"/>


    <!-- sector: Frontend -->

    <path d="
      M637 140
      L637 75
      A65 65 0 0 1 693.3 172.5
      Z"
      fill="#a78bfa"
      fill-opacity=".10"
      stroke="#a78bfa"
      stroke-opacity=".3"
      stroke-width=".5"/>


    <!-- sector: Backend -->

    <path d="
      M637 140
      L693.3 172.5
      A65 65 0 0 1 580.7 172.5
      Z"
      fill="#00d4ff"
      fill-opacity=".10"
      stroke="#00d4ff"
      stroke-opacity=".3"
      stroke-width=".5"/>


    <!-- radar axes -->

    <line x1="637"
          y1="140"
          x2="637"
          y2="75"
          stroke="#64748b"
          stroke-width=".5"
          opacity=".3"/>

    <line x1="637"
          y1="140"
          x2="693.3"
          y2="172.5"
          stroke="#64748b"
          stroke-width=".5"
          opacity=".3"/>

    <line x1="637"
          y1="140"
          x2="580.7"
          y2="172.5"
          stroke="#64748b"
          stroke-width=".5"
          opacity=".3"/>


    <!-- rotating sweep -->

    <g>

      <path d="
        M637 140
        L604.5 83.7
        A65 65 0 0 1 637 75
        Z"
        fill="#00d4ff"
        fill-opacity=".07"/>

      <polygon points="634.5,140 637,75 639.5,140"
               fill="#00d4ff"
               opacity=".25"/>

      <polygon points="636.2,140 637,75 637.8,140"
               fill="#00d4ff"
               opacity=".55"/>

      <circle cx="637"
              cy="75"
              r="2"
              fill="#00d4ff">

        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="2s"
                 repeatCount="indefinite"/>

      </circle>

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 637 140"
        to="360 637 140"
        dur="8s"
        repeatCount="indefinite"/>

    </g>


    <!-- center -->

    <circle cx="637"
            cy="140"
            r="4"
            fill="#0f1623"
            stroke="#00d4ff"
            stroke-width="1"/>

    <circle cx="637"
            cy="140"
            r="2"
            fill="#00d4ff">

      <animate attributeName="r"
               values="1.5;3;1.5"
               dur="2s"
               repeatCount="indefinite"/>

    </circle>


    <!-- ============================== -->
    <!-- FRONTEND -->
    <!-- ============================== -->

    <text x="709"
          y="98"
          fill="#a78bfa"
          font-size="9"
          font-family="monospace">
      Frontend
    </text>

    <text x="709"
          y="110"
          fill="#64748b"
          font-size="8"
          font-family="monospace">
      HTML5 • CSS
    </text>


    <!-- ============================== -->
    <!-- BACKEND -->
    <!-- ============================== -->

    <text x="637"
          y="218"
          text-anchor="middle"
          fill="#00d4ff"
          font-size="9"
          font-family="monospace">
      Backend
    </text>

    <text x="637"
          y="230"
          text-anchor="middle"
          fill="#64748b"
          font-size="8"
          font-family="monospace">
      Python • C • MongoDB
    </text>


    <!-- ============================== -->
    <!-- DEVOPS -->
    <!-- ============================== -->

    <text x="565"
          y="98"
          text-anchor="end"
          fill="#ffb020"
          font-size="9"
          font-family="monospace">
      DevOps
    </text>

    <text x="565"
          y="110"
          text-anchor="end"
          fill="#64748b"
          font-size="8"
          font-family="monospace">
      Docker • Git • Actions
    </text>


    <!-- radar nodes -->

    <g>

      <circle cx="642"
              cy="116"
              r="3"
              fill="#a78bfa"
              opacity=".4">
        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="2.8s"
                 begin=".2s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="672"
              cy="120"
              r="3"
              fill="#a78bfa"
              opacity=".4">
        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="3.1s"
                 begin=".7s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="690"
              cy="158"
              r="3"
              fill="#a78bfa"
              opacity=".4">
        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="3.4s"
                 begin="1.1s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="655"
              cy="156"
              r="3"
              fill="#00d4ff"
              opacity=".4">
        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="2.7s"
                 begin="1.5s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="637"
              cy="180"
              r="3"
              fill="#00d4ff"
              opacity=".4">
        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="3s"
                 begin="2s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="595"
              cy="177"
              r="3"
              fill="#00d4ff"
              opacity=".4">
        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="3.5s"
                 begin="2.5s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="614"
              cy="148"
              r="3"
              fill="#ffb020"
              opacity=".4">
        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="2.9s"
                 begin="3s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="602"
              cy="120"
              r="3"
              fill="#ffb020"
              opacity=".4">
        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="3.2s"
                 begin="3.5s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="626"
              cy="85"
              r="3"
              fill="#ffb020"
              opacity=".4">
        <animate attributeName="opacity"
                 values=".3;1;.3"
                 dur="3.7s"
                 begin="4s"
                 repeatCount="indefinite"/>
      </circle>

    </g>

  </g>


  <!-- bottom accent -->

  <line x1="30"
        y1="202"
        x2="395"
        y2="202"
        stroke="#1a2332"
        stroke-width="1"/>

  <line x1="460"
        y1="202"
        x2="790"
        y2="202"
        stroke="#1a2332"
        stroke-width="1"/>

</svg>