<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="330"
     viewBox="0 0 1200 330">

  <defs>

    <!-- Background -->
    <linearGradient id="bg"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1423"/>
      <stop offset="50%" stop-color="#101d32"/>
      <stop offset="100%" stop-color="#080f1c"/>
    </linearGradient>

    <!-- Animated accent -->
    <linearGradient id="accent"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55b7df">
        <animate attributeName="stop-color"
                 values="#55b7df;#9c82ef;#38c7d1;#55b7df"
                 dur="6s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#9c82ef">
        <animate attributeName="stop-color"
                 values="#9c82ef;#38c7d1;#55b7df;#9c82ef"
                 dur="6s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#38c7d1">
        <animate attributeName="stop-color"
                 values="#38c7d1;#55b7df;#9c82ef;#38c7d1"
                 dur="6s"
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- Background -->
  <rect width="1200"
        height="330"
        rx="18"
        fill="url(#bg)"
        stroke="#17243a"
        stroke-width="2"/>


  <!-- Animated outer border -->
  <rect x="1"
        y="1"
        width="1198"
        height="328"
        rx="17"
        fill="none"
        stroke="url(#accent)"
        stroke-width="1"
        opacity=".35"/>


  <!-- Header -->
  <g font-family="Arial, sans-serif">

    <text x="55"
          y="50"
          fill="url(#accent)"
          font-size="12"
          font-weight="700"
          letter-spacing="4">
      LANGUAGE TELEMETRY
    </text>

    <text x="700"
          y="50"
          fill="url(#accent)"
          font-size="12"
          font-weight="700"
          letter-spacing="4">
      FOCUS SECTORS
    </text>

  </g>


  <!-- Header divider -->
  <path d="M55 65H590"
        stroke="#1d2a3f"
        stroke-width="1"/>

  <path d="M700 65H1145"
        stroke="#1d2a3f"
        stroke-width="1"/>


  <!-- Language names -->
  <g font-family="Arial, sans-serif"
     font-size="13"
     fill="#a9b5c7">

    <text x="55" y="91">Python</text>
    <text x="55" y="126">HTML5</text>
    <text x="55" y="161">CSS3</text>
    <text x="55" y="196">GitHub Actions</text>
    <text x="55" y="231">Git</text>
    <text x="55" y="266">Docker</text>

  </g>


  <!-- Language icons -->
  <g font-family="Arial, sans-serif"
     font-size="9"
     font-weight="700"
     text-anchor="middle">

    <circle cx="32" cy="86" r="9"
            fill="#16283b"
            stroke="#3d86bd"/>

    <text x="32" y="90" fill="#55b7df">P</text>


    <circle cx="32" cy="121" r="9"
            fill="#16283b"
            stroke="#4b83bd"/>

    <text x="32" y="125" fill="#66aee8">H</text>


    <circle cx="32" cy="156" r="9"
            fill="#16283b"
            stroke="#d8bd46"/>

    <text x="32" y="160" fill="#d8bd46">C</text>


    <circle cx="32" cy="191" r="9"
            fill="#16283b"
            stroke="#28a9bd"/>

    <text x="32" y="195" fill="#38c7d1">A</text>


    <circle cx="32" cy="226" r="9"
            fill="#16283b"
            stroke="#b9826d"/>

    <text x="32" y="230" fill="#c28d77">G</text>


    <circle cx="32" cy="261" r="9"
            fill="#16283b"
            stroke="#566273"/>

    <text x="32" y="265" fill="#8d99aa">D</text>

  </g>


  <!-- Language progress background -->
  <g fill="#162235">

    <rect x="160" y="78"
          width="150"
          height="14"
          rx="4"/>

    <rect x="160" y="113"
          width="150"
          height="14"
          rx="4"/>

    <rect x="160" y="148"
          width="150"
          height="14"
          rx="4"/>

    <rect x="160" y="183"
          width="150"
          height="14"
          rx="4"/>

    <rect x="160" y="218"
          width="150"
          height="14"
          rx="4"/>

    <rect x="160" y="253"
          width="150"
          height="14"
          rx="4"/>

  </g>


  <!-- Animated progress bars -->
  <g>

    <rect x="160" y="78"
          width="150"
          height="14"
          rx="4"
          fill="#3d86bd">
      <animate attributeName="width"
               from="0"
               to="150"
               dur="1.2s"
               fill="freeze"/>
    </rect>


    <rect x="160" y="113"
          width="120"
          height="14"
          rx="4"
          fill="#4b83bd">
      <animate attributeName="width"
               from="0"
               to="120"
               dur="1.3s"
               fill="freeze"/>
    </rect>


    <rect x="160" y="148"
          width="55"
          height="14"
          rx="4"
          fill="#d8bd46">
      <animate attributeName="width"
               from="0"
               to="55"
               dur="1.4s"
               fill="freeze"/>
    </rect>


    <rect x="160" y="183"
          width="45"
          height="14"
          rx="4"
          fill="#28a9bd">
      <animate attributeName="width"
               from="0"
               to="45"
               dur="1.5s"
               fill="freeze"/>
    </rect>


    <rect x="160" y="218"
          width="18"
          height="14"
          rx="4"
          fill="#b9826d">
      <animate attributeName="width"
               from="0"
               to="18"
               dur="1.6s"
               fill="freeze"/>
    </rect>


    <rect x="160" y="253"
          width="8"
          height="14"
          rx="4"
          fill="#566273">
      <animate attributeName="width"
               from="0"
               to="8"
               dur="1.7s"
               fill="freeze"/>
    </rect>

  </g>


  <!-- Percentage values -->
  <g font-family="Arial, sans-serif"
     font-size="12"
     fill="#738198">

    <text x="335" y="90">40.7%</text>
    <text x="335" y="125">34.4%</text>
    <text x="335" y="160">10.9%</text>
    <text x="335" y="195">8.6%</text>
    <text x="335" y="230">4.1%</text>
    <text x="335" y="265">1.4%</text>

  </g>


  <!-- Left panel footer -->
  <text x="55"
        y="300"
        fill="#52627a"
        font-family="Arial, sans-serif"
        font-size="9"
        letter-spacing="2">
    DEVELOPMENT STACK
  </text>


  <!-- Focus sectors container -->
  <g transform="translate(900 170)">

    <!-- Outer rotating ring -->
    <circle r="91"
            fill="none"
            stroke="#1c2b40"
            stroke-width="1"
            stroke-dasharray="4 8">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="18s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Main circle -->
    <circle r="82"
            fill="#121d2d"
            stroke="#26354c"
            stroke-width="2"/>


    <!-- Rotating sector chart -->
    <g>

      <path d="M0 0
               L0 -82
               A82 82 0 0 1 75 33
               Z"
            fill="#5b55a3"
            opacity=".75"/>

      <path d="M0 0
               L75 33
               A82 82 0 0 1 -34 75
               Z"
            fill="#168da5"
            opacity=".75"/>

      <path d="M0 0
               L-34 75
               A82 82 0 0 1 -75 -34
               Z"
            fill="#8c6c31"
            opacity=".75"/>

      <path d="M0 0
               L-75 -34
               A82 82 0 0 1 0 -82
               Z"
            fill="#3a345f"
            opacity=".75"/>

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="-360"
        dur="24s"
        repeatCount="indefinite"/>

    </g>


    <!-- Center -->
    <circle r="25"
            fill="#0b1423"
            stroke="url(#accent)"
            stroke-width="2"
            filter="url(#glow)">

      <animate attributeName="r"
               values="23;27;23"
               dur="2.5s"
               repeatCount="indefinite"/>

    </circle>


    <text x="0"
          y="5"
          text-anchor="middle"
          fill="#eaf2ff"
          font-family="Arial, sans-serif"
          font-size="12"
          font-weight="700">
      DEV
    </text>


    <!-- Sector labels -->
    <text x="105"
          y="-55"
          fill="#8c83d2"
          font-family="Arial, sans-serif"
          font-size="12">
      Frontend
    </text>

    <text x="70"
          y="72"
          fill="#34b8c9"
          font-family="Arial, sans-serif"
          font-size="12">
      Backend
    </text>

    <text x="-125"
          y="-5"
          fill="#d0a23c"
          font-family="Arial, sans-serif"
          font-size="12">
      DevOps
    </text>

    <text x="-105"
          y="68"
          fill="#7770b8"
          font-family="Arial, sans-serif"
          font-size="11">
      Automation
    </text>

  </g>


  <!-- Bottom status -->
  <path d="M700 285H1145"
        stroke="#17243a"
        stroke-width="1"/>

  <text x="700"
        y="305"
        fill="#52627a"
        font-family="Arial, sans-serif"
        font-size="9"
        letter-spacing="2">
    FOCUS MATRIX
  </text>

  <text x="1145"
        y="305"
        text-anchor="end"
        fill="#38c7d1"
        font-family="Arial, sans-serif"
        font-size="9"
        letter-spacing="2">
    TELEMETRY ACTIVE
  </text>

</svg>