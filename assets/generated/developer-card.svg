<svg xmlns="http://www.w3.org/2000/svg"
     width="600"
     height="390"
     viewBox="0 0 600 390">

  <defs>

    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Red glow -->
    <filter id="redGlow"
            x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Green glow -->
    <filter id="greenGlow"
            x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Code panel gradient -->
    <linearGradient id="codeBg"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#11161d"/>
    </linearGradient>

    <!-- Card shadow -->
    <filter id="cardShadow"
            x="-20%" y="-20%"
            width="140%" height="140%">
      <feDropShadow dx="0"
                    dy="0"
                    stdDeviation="10"
                    flood-color="#ff4444"
                    flood-opacity="0.22"/>
    </filter>

    <!-- Subtle grid -->
    <pattern id="grid"
             width="30"
             height="30"
             patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.025"
            stroke-width="1"/>
    </pattern>

  </defs>


  <!-- ====================================================== -->
  <!-- CARD -->
  <!-- ====================================================== -->

  <rect x="5"
        y="5"
        width="590"
        height="380"
        rx="16"
        fill="url(#bg)"
        stroke="#ff4444"
        stroke-width="1.5"
        filter="url(#cardShadow)"/>

  <!-- Background grid -->
  <rect x="6"
        y="6"
        width="588"
        height="378"
        rx="15"
        fill="url(#grid)"/>


  <!-- ====================================================== -->
  <!-- TOP BAR -->
  <!-- ====================================================== -->

  <!-- Window dots -->

  <circle cx="30"
          cy="30"
          r="6"
          fill="#ff5f56"/>

  <circle cx="50"
          cy="30"
          r="6"
          fill="#ffbd2e"/>

  <circle cx="70"
          cy="30"
          r="6"
          fill="#27c93f"/>


  <!-- Filename -->

  <text x="300"
        y="35"
        text-anchor="middle"
        fill="#8b949e"
        font-family="monospace"
        font-size="14">
    dev-workspace.config
  </text>


  <!-- Online badge -->

  <rect x="490"
        y="18"
        width="82"
        height="25"
        rx="12"
        fill="#27c93f"
        fill-opacity="0.12"
        stroke="#27c93f"
        stroke-opacity="0.18"/>

  <circle cx="504"
          cy="30.5"
          r="4"
          fill="#27c93f"
          filter="url(#greenGlow)"/>

  <text x="514"
        y="35"
        fill="#27c93f"
        font-family="Arial, sans-serif"
        font-size="12"
        font-weight="700">
    Online
  </text>


  <!-- ====================================================== -->
  <!-- CODE WINDOW -->
  <!-- ====================================================== -->

  <rect x="25"
        y="65"
        width="550"
        height="175"
        rx="9"
        fill="url(#codeBg)"
        stroke="#21262d"
        stroke-width="1"/>


  <!-- Code title -->

  <text x="42"
        y="88"
        fill="#8b949e"
        font-family="monospace"
        font-size="11">
    developer.js
  </text>


  <!-- const developer -->

  <text x="42"
        y="118"
        font-family="monospace"
        font-size="14">

    <tspan fill="#ff7b72">const</tspan>
    <tspan fill="#ffa657"> developer</tspan>
    <tspan fill="#e6edf3"> = {</tspan>

  </text>


  <!-- name -->

  <text x="62"
        y="144"
        font-family="monospace"
        font-size="14">

    <tspan fill="#79c0ff">name</tspan>
    <tspan fill="#e6edf3">: </tspan>
    <tspan fill="#7ee787">'Mohammed'</tspan>
    <tspan fill="#e6edf3">,</tspan>

  </text>


  <!-- college -->

  <text x="62"
        y="170"
        font-family="monospace"
        font-size="14">

    <tspan fill="#79c0ff">college</tspan>
    <tspan fill="#e6edf3">: </tspan>
    <tspan fill="#7ee787">'IIET, Siddipet'</tspan>
    <tspan fill="#e6edf3">,</tspan>

  </text>


  <!-- specialization -->

  <text x="62"
        y="196"
        font-family="monospace"
        font-size="14">

    <tspan fill="#79c0ff">specialization</tspan>
    <tspan fill="#e6edf3">: </tspan>
    <tspan fill="#7ee787">'Web Development & Automation Bots'</tspan>

  </text>


  <!-- closing -->

  <text x="42"
        y="222"
        font-family="monospace"
        font-size="14">

    <tspan fill="#e6edf3">};</tspan>

  </text>


  <!-- ====================================================== -->
  <!-- STATS -->
  <!-- ====================================================== -->

  <!-- Left stat -->

  <rect x="25"
        y="260"
        width="267"
        height="100"
        rx="9"
        fill="#161b22"
        stroke="#21262d"
        stroke-width="1"/>


  <text x="158.5"
        y="299"
        text-anchor="middle"
        fill="#ffffff"
        font-family="Arial, sans-serif"
        font-size="23"
        font-weight="700">
    6+ Months
  </text>

  <text x="158.5"
        y="322"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="12">
    Website Experience 
  </text>


  <!-- Small red accent -->

  <rect x="112"
        y="339"
        width="93"
        height="2"
        rx="1"
        fill="#ff4444"
        opacity="0.8"
        filter="url(#redGlow)"/>


  <!-- Right stat -->

  <rect x="308"
        y="260"
        width="267"
        height="100"
        rx="9"
        fill="#161b22"
        stroke="#21262d"
        stroke-width="1"/>


  <text x="441.5"
        y="299"
        text-anchor="middle"
        fill="#ffffff"
        font-family="Arial, sans-serif"
        font-size="23"
        font-weight="700">
    3rd Year
  </text>

  <text x="441.5"
        y="322"
        text-anchor="middle"
        fill="#8b949e"
        font-family="Arial, sans-serif"
        font-size="12">
    B.Tech
  </text>


  <!-- Small red accent -->

  <rect x="395"
        y="339"
        width="93"
        height="2"
        rx="1"
        fill="#ff4444"
        opacity="0.8"
        filter="url(#redGlow)"/>


  <!-- ====================================================== -->
  <!-- ANIMATION -->
  <!-- ====================================================== -->

  <!-- Online pulse -->

  <circle cx="504"
          cy="30.5"
          r="4"
          fill="none"
          stroke="#27c93f"
          stroke-width="1"
          opacity="0.8">

    <animate attributeName="r"
             values="4;8;4"
             dur="2s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0.8;0;0.8"
             dur="2s"
             repeatCount="indefinite"/>

  </circle>


  <!-- Border glow pulse -->

  <rect x="5"
        y="5"
        width="590"
        height="380"
        rx="16"
        fill="none"
        stroke="#ff4444"
        stroke-width="1"
        opacity="0.35">

    <animate attributeName="opacity"
             values="0.2;0.55;0.2"
             dur="3s"
             repeatCount="indefinite"/>

  </rect>


  <!-- Cursor blink -->

  <rect x="116"
        y="108"
        width="2"
        height="16"
        fill="#e6edf3">

    <animate attributeName="opacity"
             values="1;0;1"
             dur="1s"
             repeatCount="indefinite"/>

  </rect>

</svg>
