<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="250"
     viewBox="0 0 1200 250">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1423"/>
      <stop offset="50%" stop-color="#101d32"/>
      <stop offset="100%" stop-color="#080f1c"/>
    </linearGradient>

    <linearGradient id="titleGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55b7df">
        <animate attributeName="stop-color"
                 values="#55b7df;#9c82ef;#38c7d1;#55b7df"
                 dur="6s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#9c82ef">
        <animate attributeName="stop-color"
                 values="#9c82ef;#38c7d1;#55b7df;#9c82ef"
                 dur="6s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#38c7d1">
        <animate attributeName="stop-color"
                 values="#38c7d1;#55b7df;#9c82ef;#38c7d1"
                 dur="6s"
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200"
        height="250"
        rx="18"
        fill="url(#bg)"
        stroke="#17243a"
        stroke-width="2"/>

  <!-- Subtle animated border -->
  <rect x="1"
        y="1"
        width="1198"
        height="248"
        rx="17"
        fill="none"
        stroke="url(#titleGradient)"
        stroke-width="1"
        opacity=".35"/>

  <!-- Header -->
  <text x="55"
        y="48"
        fill="url(#titleGradient)"
        font-family="Arial, sans-serif"
        font-size="12"
        font-weight="700"
        letter-spacing="4">
    MISSION TELEMETRY
  </text>

  <!-- Animated scanning line -->
  <rect x="55"
        y="61"
        width="1090"
        height="1"
        fill="#263752"
        opacity=".7"/>

  <rect x="55"
        y="61"
        width="140"
        height="1"
        fill="#38c7d1"
        filter="url(#glow)">
    <animate attributeName="x"
             values="55;1005;55"
             dur="5s"
             repeatCount="indefinite"/>
  </rect>

  <!-- Stat separators -->
  <g stroke="#1d2a3f"
     stroke-width="1">

    <path d="M270 78V184"/>
    <path d="M510 78V184"/>
    <path d="M750 78V184"/>
    <path d="M990 78V184"/>

  </g>

  <!-- Icons -->
  <g font-family="Arial, sans-serif"
     font-size="18"
     text-anchor="middle">

    <text x="150" y="95" fill="#55b7df" filter="url(#glow)">
      ✦
    </text>

    <text x="390" y="95" fill="#d5a23d" filter="url(#glow)">
      ★
    </text>

    <text x="630" y="95" fill="#9c82ef" filter="url(#glow)">
      ◈
    </text>

    <text x="870" y="95" fill="#38c7d1" filter="url(#glow)">
      ◉
    </text>

    <text x="1090" y="95" fill="#9c82ef" filter="url(#glow)">
      ▣
    </text>

  </g>

  <!-- Main numbers -->
  <g fill="#eaf2ff"
     font-family="Arial, sans-serif"
     font-size="34"
     font-weight="700"
     text-anchor="middle">

    <text x="150" y="135">
      551
    </text>

    <text x="390" y="135">
      69
    </text>

    <text x="630" y="135">
      0
    </text>

    <text x="870" y="135">
      0
    </text>

    <text x="1090" y="135">
      9
    </text>

  </g>

  <!-- Labels -->
  <g fill="#738198"
     font-family="Arial, sans-serif"
     font-size="12"
     text-anchor="middle">

    <text x="150" y="163">Commits</text>
    <text x="390" y="163">Stars</text>
    <text x="630" y="163">PRs</text>
    <text x="870" y="163">Issues</text>
    <text x="1090" y="163">Repos</text>

  </g>

  <!-- Status indicators -->
  <g font-family="Arial, sans-serif"
     font-size="9"
     text-anchor="middle">

    <circle cx="150" cy="188" r="3" fill="#38c7d1">
      <animate attributeName="opacity"
               values=".3;1;.3"
               dur="1.5s"
               repeatCount="indefinite"/>
    </circle>

    <text x="163" y="192" fill="#52627a">
      ACTIVE
    </text>


    <circle cx="390" cy="188" r="3" fill="#d5a23d">
      <animate attributeName="opacity"
               values=".3;1;.3"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

    <text x="403" y="192" fill="#52627a">
      TRACKED
    </text>


    <circle cx="630" cy="188" r="3" fill="#9c82ef">
      <animate attributeName="opacity"
               values=".3;1;.3"
               dur="2.4s"
               repeatCount="indefinite"/>
    </circle>

    <text x="643" y="192" fill="#52627a">
      MONITORED
    </text>


    <circle cx="870" cy="188" r="3" fill="#38c7d1">
      <animate attributeName="opacity"
               values=".3;1;.3"
               dur="1.8s"
               repeatCount="indefinite"/>
    </circle>

    <text x="883" y="192" fill="#52627a">
      STABLE
    </text>


    <circle cx="1090" cy="188" r="3" fill="#9c82ef">
      <animate attributeName="opacity"
               values=".3;1;.3"
               dur="2.2s"
               repeatCount="indefinite"/>
    </circle>

    <text x="1103" y="192" fill="#52627a">
      ONLINE
    </text>

  </g>

  <!-- Bottom telemetry line -->
  <path d="M55 215 H1145"
        stroke="#17243a"
        stroke-width="1"/>

  <text x="55"
        y="232"
        fill="#52627a"
        font-family="Arial, sans-serif"
        font-size="9"
        letter-spacing="2">
    SYSTEM STATUS
  </text>

  <text x="1145"
        y="232"
        text-anchor="end"
        fill="#38c7d1"
        font-family="Arial, sans-serif"
        font-size="9"
        letter-spacing="2">
    ONLINE • TELEMETRY ACTIVE
  </text>

</svg>