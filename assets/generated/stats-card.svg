<svg xmlns="http://www.w3.org/2000/svg"
     width="850"
     height="180"
     viewBox="0 0 850 180">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1623"/>
      <stop offset="50%" stop-color="#0b1321"/>
      <stop offset="100%" stop-color="#080e19"/>
    </linearGradient>

    <!-- Number glow -->
    <filter id="numGlow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <!-- Icon glow -->
    <filter id="iconGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Animated accent -->
    <linearGradient id="accent">
      <stop offset="0%" stop-color="#00d4ff">
        <animate attributeName="stop-color"
                 values="#00d4ff;#a78bfa;#ff4ecd;#00d4ff"
                 dur="8s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#a78bfa">
        <animate attributeName="stop-color"
                 values="#a78bfa;#ff4ecd;#00d4ff;#a78bfa"
                 dur="8s"
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>

  </defs>


  <!-- CARD -->
  <rect x=".5"
        y=".5"
        width="849"
        height="179"
        rx="14"
        fill="url(#bg)"
        stroke="#1a2332"
        stroke-width="1"/>


  <!-- TOP ACCENT LINE -->
  <rect x="30"
        y="48"
        width="790"
        height="1"
        fill="url(#accent)"
        opacity=".35"/>


  <!-- TITLE -->
  <text x="30"
        y="35"
        fill="#64748b"
        font-size="11"
        font-family="monospace"
        letter-spacing="3">
    MISSION TELEMETRY
  </text>


  <!-- ONLINE STATUS -->
  <circle cx="798"
          cy="31"
          r="3"
          fill="#22c4df">

    <animate attributeName="opacity"
             values=".3;1;.3"
             dur="2s"
             repeatCount="indefinite"/>

    <animate attributeName="r"
             values="2.5;4;2.5"
             dur="2s"
             repeatCount="indefinite"/>
  </circle>

  <text x="815"
        y="35"
        text-anchor="end"
        fill="#56647a"
        font-size="10"
        font-family="monospace">
    ONLINE
  </text>


  <!-- DIVIDERS -->
  <g stroke="#1a2332"
     stroke-width="1"
     opacity=".7">

    <line x1="170" y1="60" x2="170" y2="155"/>
    <line x1="340" y1="60" x2="340" y2="155"/>
    <line x1="510" y1="60" x2="510" y2="155"/>
    <line x1="680" y1="60" x2="680" y2="155"/>

  </g>


  <!-- ========================= -->
  <!-- COMMITS -->
  <!-- ========================= -->

  <g transform="translate(85 105)">

    <!-- icon glow -->
    <circle cx="0"
            cy="-28"
            r="12"
            fill="#00d4ff"
            opacity=".12"
            filter="url(#iconGlow)"/>

    <!-- icon -->
    <circle cx="0"
            cy="-28"
            r="7"
            fill="none"
            stroke="#00d4ff"
            stroke-width="1.5">

      <animate attributeName="stroke-opacity"
               values=".5;1;.5"
               dur="4s"
               repeatCount="indefinite"/>

    </circle>

    <path d="M-7 -28H7"
          stroke="#00d4ff"
          stroke-width="1.5"/>

    <!-- number glow -->
    <text x="0"
          y="7"
          text-anchor="middle"
          fill="#00d4ff"
          font-size="28"
          font-weight="700"
          font-family="Arial, sans-serif"
          opacity=".45"
          filter="url(#numGlow)">
      551
    </text>

    <!-- number -->
    <text x="0"
          y="7"
          text-anchor="middle"
          fill="#f1f5f9"
          font-size="28"
          font-weight="700"
          font-family="Arial, sans-serif">
      551
    </text>

    <text x="0"
          y="27"
          text-anchor="middle"
          fill="#64748b"
          font-size="10"
          font-family="monospace"
          letter-spacing="1">
      COMMITS
    </text>

  </g>


  <!-- ========================= -->
  <!-- STARS -->
  <!-- ========================= -->

  <g transform="translate(255 105)">

    <circle cx="0"
            cy="-28"
            r="12"
            fill="#ffb020"
            opacity=".12"
            filter="url(#iconGlow)"/>

    <path d="
      M0 -36
      L2.3 -30.3
      L8.5 -30
      L3.7 -26
      L5.2 -20
      L0 -23.3
      L-5.2 -20
      L-3.7 -26
      L-8.5 -30
      L-2.3 -30.3 Z"
      fill="#ffb020">

      <animate attributeName="opacity"
               values=".55;1;.55"
               dur="4s"
               repeatCount="indefinite"/>

    </path>

    <text x="0"
          y="7"
          text-anchor="middle"
          fill="#ffb020"
          font-size="28"
          font-weight="700"
          font-family="Arial, sans-serif"
          opacity=".45"
          filter="url(#numGlow)">
      69
    </text>

    <text x="0"
          y="7"
          text-anchor="middle"
          fill="#f1f5f9"
          font-size="28"
          font-weight="700"
          font-family="Arial, sans-serif">
      69
    </text>

    <text x="0"
          y="27"
          text-anchor="middle"
          fill="#64748b"
          font-size="10"
          font-family="monospace"
          letter-spacing="1">
      STARS
    </text>

  </g>


  <!-- ========================= -->
  <!-- PULL REQUESTS -->
  <!-- ========================= -->

  <g transform="translate(425 105)">

    <circle cx="0"
            cy="-28"
            r="12"
            fill="#a78bfa"
            opacity=".12"
            filter="url(#iconGlow)"/>

    <!-- PR icon -->
    <circle cx="-5"
            cy="-34"
            r="3"
            fill="none"
            stroke="#a78bfa"
            stroke-width="1.5"/>

    <circle cx="5"
            cy="-22"
            r="3"
            fill="none"
            stroke="#a78bfa"
            stroke-width="1.5"/>

    <path d="M-5 -31V-24
             Q-5 -22 0 -22H2"
          fill="none"
          stroke="#a78bfa"
          stroke-width="1.5"/>

    <text x="0"
          y="7"
          text-anchor="middle"
          fill="#a78bfa"
          font-size="28"
          font-weight="700"
          font-family="Arial, sans-serif"
          opacity=".45"
          filter="url(#numGlow)">
      0
    </text>

    <text x="0"
          y="7"
          text-anchor="middle"
          fill="#f1f5f9"
          font-size="28"
          font-weight="700"
          font-family="Arial, sans-serif">
      0
    </text>

    <text x="0"
          y="27"
          text-anchor="middle"
          fill="#64748b"
          font-size="10"
          font-family="monospace"
          letter-spacing="1">
      PULL REQUESTS
    </text>

  </g>


  <!-- ========================= -->
  <!-- ISSUES -->
  <!-- ========================= -->

  <g transform="translate(595 105)">

    <circle cx="0"
            cy="-28"
            r="12"
            fill="#00d4ff"
            opacity=".12"
            filter="url(#iconGlow)"/>

    <circle cx="0"
            cy="-28"
            r="8"
            fill="none"
            stroke="#00d4ff"
            stroke-width="1.5"/>

    <circle cx="0"
            cy="-28"
            r="2"
            fill="#00d4ff"/>

    <text x="0"
          y="7"
          text-anchor="middle"
          fill="#00d4ff"
          font-size="28"
          font-weight="700"
          font-family="Arial, sans-serif"
          opacity=".45"
          filter="url(#numGlow)">
      0
    </text>

    <text x="0"
          y="7"
          text-anchor="middle"
          fill="#f1f5f9"
          font-size="28"
          font-weight="700"
          font-family="Arial, sans-serif">
      0
    </text>

    <text x="0"
          y="27"
          text-anchor="middle"
          fill="#64748b"
          font-size="10"
          font-family="monospace"
          letter-spacing="1">
      ISSUES
    </text>

  </g>


  <!-- ========================= -->
  <!-- REPOSITORIES -->
  <!-- ========================= -->

  <g transform="translate(765 105)">

    <circle cx="0"
            cy="-28"
            r="12"
            fill="#a78bfa"
            opacity=".12"
            filter="url(#iconGlow)"/>

    <!-- repository icon -->
    <rect x="-7"
          y="-36"
          width="14"
          height="15"
          rx="2"
          fill="none"
          stroke="#a78bfa"
          stroke-width="1.5"/>

    <line x1="-4"
          y1="-32"
          x2="4"
          y2="-32"
          stroke="#a78bfa"
          stroke-width="1"/>

    <line x1="-4"
          y1="-28"
          x2="4"
          y2="-28"
          stroke="#a78bfa"
          stroke-width="1"/>

    <text x="0"
          y="7"
          text-anchor="middle"
          fill="#a78bfa"
          font-size="28"
          font-weight="700"
          font-family="Arial, sans-serif"
          opacity=".45"
          filter="url(#numGlow)">
      9
    </text>

    <text x="0"
          y="7"
          text-anchor="middle"
          fill="#f1f5f9"
          font-size="28"
          font-weight="700"
          font-family="Arial, sans-serif">
      9
    </text>

    <text x="0"
          y="27"
          text-anchor="middle"
          fill="#64748b"
          font-size="10"
          font-family="monospace"
          letter-spacing="1">
      REPOSITORIES
    </text>

  </g>


  <!-- BOTTOM STATUS -->
  <text x="425"
        y="168"
        text-anchor="middle"
        fill="#334155"
        font-size="8"
        font-family="monospace"
        letter-spacing="2">
    GITHUB DEVELOPMENT TELEMETRY
  </text>

</svg>