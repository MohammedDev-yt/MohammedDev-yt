<svg xmlns="http://www.w3.org/2000/svg"
     width="850"
     height="280"
     viewBox="0 0 850 280">

  <defs>

    <!-- Background -->
    <radialGradient id="bg" cx="50%" cy="55%" r="75%">
      <stop offset="0%" stop-color="#111d32"/>
      <stop offset="55%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#050912"/>
    </radialGradient>

    <!-- Core gradients -->
    <radialGradient id="coreGlow">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset="35%" stop-color="#00d4ff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGradient">
      <stop offset="0%" stop-color="#00d4ff">
        <animate attributeName="stop-color"
                 values="#00d4ff;#a78bfa;#ff4ecd;#00d4ff"
                 dur="7s"
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a78bfa">
        <animate attributeName="stop-color"
                 values="#a78bfa;#ff4ecd;#00d4ff;#a78bfa"
                 dur="7s"
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff4ecd">
        <animate attributeName="stop-color"
                 values="#ff4ecd;#00d4ff;#a78bfa;#ff4ecd"
                 dur="7s"
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

  </defs>


  <!-- BACKGROUND -->
  <rect width="850"
        height="280"
        rx="14"
        fill="url(#bg)"
        stroke="#17243a"/>


  <!-- NEBULA -->
  <circle cx="245"
          cy="125"
          r="100"
          fill="#a78bfa"
          opacity=".025"
          filter="url(#bigGlow)">
    <animate attributeName="opacity"
             values=".015;.04;.015"
             dur="8s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="625"
          cy="170"
          r="100"
          fill="#ffb020"
          opacity=".02"
          filter="url(#bigGlow)">
    <animate attributeName="opacity"
             values=".01;.035;.01"
             dur="10s"
             repeatCount="indefinite"/>
  </circle>


  <!-- STARS -->
  <g fill="#ffffff">

    <circle cx="70" cy="42" r="1">
      <animate attributeName="opacity"
               values=".15;1;.15"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="125" cy="92" r=".7">
      <animate attributeName="opacity"
               values=".2;.7;.2"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="185" cy="220" r="1.2">
      <animate attributeName="opacity"
               values=".1;.8;.1"
               dur="5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="245" cy="70" r=".8">
      <animate attributeName="opacity"
               values=".2;.9;.2"
               dur="3.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="310" cy="45" r="1">
      <animate attributeName="opacity"
               values=".1;.8;.1"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="365" cy="225" r=".8">
      <animate attributeName="opacity"
               values=".2;.9;.2"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="485" cy="45" r="1">
      <animate attributeName="opacity"
               values=".15;.9;.15"
               dur="4.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="550" cy="225" r="1.2">
      <animate attributeName="opacity"
               values=".1;.8;.1"
               dur="3.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="625" cy="70" r=".8">
      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="700" cy="205" r="1">
      <animate attributeName="opacity"
               values=".15;.8;.15"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="770" cy="75" r="1.2">
      <animate attributeName="opacity"
               values=".1;.9;.1"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="810" cy="190" r=".7">
      <animate attributeName="opacity"
               values=".2;.7;.2"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="90" cy="230" r=".8">
      <animate attributeName="opacity"
               values=".15;.9;.15"
               dur="3.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="740" cy="120" r=".7">
      <animate attributeName="opacity"
               values=".2;.8;.2"
               dur="5s"
               repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- GALAXY SPIRAL -->
  <g fill="none"
     stroke-linecap="round">

    <path d="
      M425 155
      Q440 150 470 153
      Q520 160 565 145
      Q630 123 700 135
      Q755 145 800 120"
      stroke="#a78bfa"
      stroke-width="1.6"
      opacity=".45">

      <animate attributeName="opacity"
               values=".2;.6;.2"
               dur="7s"
               repeatCount="indefinite"/>

    </path>

    <path d="
      M425 155
      Q410 165 375 170
      Q320 178 275 165
      Q215 148 150 165
      Q105 176 65 155"
      stroke="#00d4ff"
      stroke-width="1.5"
      opacity=".45">

      <animate attributeName="opacity"
               values=".2;.6;.2"
               dur="8s"
               repeatCount="indefinite"/>

    </path>

    <path d="
      M425 155
      Q450 175 500 190
      Q565 210 625 205
      Q690 198 760 225"
      stroke="#ffb020"
      stroke-width="1.3"
      opacity=".35">

      <animate attributeName="opacity"
               values=".15;.5;.15"
               dur="9s"
               repeatCount="indefinite"/>

    </path>

  </g>


  <!-- ORBITAL RINGS -->
  <g fill="none">

    <ellipse cx="425"
             cy="155"
             rx="72"
             ry="24"
             stroke="#00d4ff"
             stroke-width=".7"
             stroke-dasharray="4 7"
             opacity=".25">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 425 155"
        to="360 425 155"
        dur="18s"
        repeatCount="indefinite"/>

    </ellipse>

    <ellipse cx="425"
             cy="155"
             rx="100"
             ry="34"
             stroke="#a78bfa"
             stroke-width=".6"
             stroke-dasharray="3 9"
             opacity=".15">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360 425 155"
        to="0 425 155"
        dur="28s"
        repeatCount="indefinite"/>

    </ellipse>

  </g>


  <!-- MOVING PARTICLES -->
  <circle r="2"
          fill="#00d4ff"
          filter="url(#glow)">

    <animateMotion
      dur="7s"
      repeatCount="indefinite"
      path="M425 155 Q470 125 540 140 Q620 155 700 125"/>

  </circle>

  <circle r="1.7"
          fill="#a78bfa"
          filter="url(#glow)">

    <animateMotion
      dur="9s"
      begin="2s"
      repeatCount="indefinite"
      path="M425 155 Q380 180 315 165 Q220 140 100 175"/>

  </circle>

  <circle r="1.8"
          fill="#ffb020"
          filter="url(#glow)">

    <animateMotion
      dur="10s"
      begin="4s"
      repeatCount="indefinite"
      path="M425 155 Q470 180 535 200 Q630 220 760 205"/>

  </circle>


  <!-- TECH NODES -->

  <g font-family="monospace"
     font-size="9">

    <!-- Python -->
    <circle cx="350" cy="132" r="2.5" fill="#00d4ff">
      <animate attributeName="r"
               values="2;3;2"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <line x1="350"
          y1="132"
          x2="325"
          y2="122"
          stroke="#00d4ff"
          stroke-width=".5"
          stroke-dasharray="2 2"/>

    <text x="322"
          y="125"
          text-anchor="end"
          fill="#00d4ff">
      Python
    </text>


    <!-- CSS -->
    <circle cx="305" cy="105" r="2.5" fill="#a78bfa">
      <animate attributeName="r"
               values="2;3;2"
               dur="3.5s"
               repeatCount="indefinite"/>
    </circle>

    <line x1="305"
          y1="105"
          x2="280"
          y2="95"
          stroke="#a78bfa"
          stroke-width=".5"
          stroke-dasharray="2 2"/>

    <text x="277"
          y="98"
          text-anchor="end"
          fill="#a78bfa">
      CSS
    </text>


    <!-- HTML5 -->
    <circle cx="280" cy="165" r="2.5" fill="#ff7b00">
      <animate attributeName="r"
               values="2;3;2"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <line x1="280"
          y1="165"
          x2="250"
          y2="170"
          stroke="#ff7b00"
          stroke-width=".5"
          stroke-dasharray="2 2"/>

    <text x="247"
          y="173"
          text-anchor="end"
          fill="#ff7b00">
      HTML5
    </text>


    <!-- C -->
    <circle cx="495" cy="145" r="2.5" fill="#00d4ff">
      <animate attributeName="r"
               values="2;3;2"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <line x1="495"
          y1="145"
          x2="520"
          y2="137"
          stroke="#00d4ff"
          stroke-width=".5"
          stroke-dasharray="2 2"/>

    <text x="525"
          y="140"
          fill="#00d4ff">
      C
    </text>


    <!-- Docker -->
    <circle cx="530" cy="170" r="2.5" fill="#ffb020">
      <animate attributeName="r"
               values="2;3;2"
               dur="3.5s"
               repeatCount="indefinite"/>
    </circle>

    <line x1="530"
          y1="170"
          x2="555"
          y2="178"
          stroke="#ffb020"
          stroke-width=".5"
          stroke-dasharray="2 2"/>

    <text x="560"
          y="181"
          fill="#ffb020">
      Docker
    </text>


    <!-- Git -->
    <circle cx="330" cy="205" r="2.5" fill="#66b3e8">
      <animate attributeName="r"
               values="2;3;2"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <line x1="330"
          y1="205"
          x2="305"
          y2="214"
          stroke="#66b3e8"
          stroke-width=".5"
          stroke-dasharray="2 2"/>

    <text x="300"
          y="217"
          text-anchor="end"
          fill="#66b3e8">
      Git
    </text>


    <!-- GitHub Actions -->
    <circle cx="540" cy="200" r="2.5" fill="#ffb020">
      <animate attributeName="r"
               values="2;3;2"
               dur="4.5s"
               repeatCount="indefinite"/>
    </circle>

    <line x1="540"
          y1="200"
          x2="570"
          y2="210"
          stroke="#ffb020"
          stroke-width=".5"
          stroke-dasharray="2 2"/>

    <text x="575"
          y="213"
          fill="#ffb020">
      GitHub Actions
    </text>


    <!-- MongoDB -->
    <circle cx="650" cy="165" r="2.5" fill="#39c8c5">
      <animate attributeName="r"
               values="2;3;2"
               dur="3.5s"
               repeatCount="indefinite"/>
    </circle>

    <line x1="650"
          y1="165"
          x2="675"
          y2="160"
          stroke="#39c8c5"
          stroke-width=".5"
          stroke-dasharray="2 2"/>

    <text x="680"
          y="163"
          fill="#39c8c5">
      MongoDB
    </text>

  </g>


  <!-- GALAXY CORE -->
  <circle cx="425"
          cy="155"
          r="42"
          fill="url(#coreGlow)"
          opacity=".4">

    <animate attributeName="r"
             values="35;48;35"
             dur="4s"
             repeatCount="indefinite"/>

  </circle>

  <ellipse cx="425"
           cy="155"
           rx="24"
           ry="20"
           fill="none"
           stroke="#00d4ff"
           stroke-width="1.2"
           stroke-dasharray="5 3"
           opacity=".65">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 425 155"
      to="360 425 155"
      dur="6s"
      repeatCount="indefinite"/>

  </ellipse>

  <circle cx="425"
          cy="155"
          r="15"
          fill="#0b1423"
          stroke="#a78bfa"
          stroke-width="1">

    <animate attributeName="r"
             values="14;17;14"
             dur="3s"
             repeatCount="indefinite"/>

  </circle>

  <circle cx="425"
          cy="155"
          r="4"
          fill="#00d4ff"
          filter="url(#glow)">

    <animate attributeName="r"
             values="3;5;3"
             dur="2s"
             repeatCount="indefinite"/>

  </circle>

  <text x="425"
        y="160"
        text-anchor="middle"
        fill="#ffffff"
        font-size="12"
        font-weight="700"
        font-family="monospace">
    M
  </text>


  <!-- PROFILE TITLE -->
  <text x="425"
        y="27"
        text-anchor="middle"
        fill="url(#titleGradient)"
        font-size="21"
        font-weight="700"
        font-family="Arial, sans-serif">
    Mohammed
  </text>

  <text x="425"
        y="45"
        text-anchor="middle"
        fill="#94a3b8"
        font-size="11.5"
        font-family="Arial, sans-serif">
    Full Stack Developer • Open Source Creator
  </text>


  <!-- QUOTE -->
  <text x="425"
        y="267"
        text-anchor="middle"
        fill="#64748b"
        font-size="10.5"
        font-family="monospace"
        font-style="italic">
    "The best code is the code that empowers others."
  </text>

</svg>