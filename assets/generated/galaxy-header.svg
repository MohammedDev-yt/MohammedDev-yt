<svg xmlns="http://www.w3.org/2000/svg"
     width="850"
     height="280"
     viewBox="0 0 850 280">

  <defs>

    <!-- ========================= -->
    <!-- BACKGROUND -->
    <!-- ========================= -->

    <radialGradient id="space"
                    cx="50%"
                    cy="50%"
                    r="70%">
      <stop offset="0%" stop-color="#111c32"/>
      <stop offset="45%" stop-color="#0b1425"/>
      <stop offset="100%" stop-color="#050a14"/>
    </radialGradient>

    <radialGradient id="coreGlow">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#67e8f9"/>
      <stop offset="45%" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="3"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow"
            x="-150%"
            y="-150%"
            width="400%"
            height="400%">
      <feGaussianBlur stdDeviation="7"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- ========================= -->
    <!-- GALAXY ORBIT PATHS -->
    <!-- ========================= -->

    <path id="orbit1"
          d="M 85 151
             C 185 62, 330 65, 425 140
             C 520 215, 670 215, 765 140"/>

    <path id="orbit2"
          d="M 75 180
             C 200 235, 335 220, 425 140
             C 515 60, 650 55, 780 115"/>

    <path id="orbit3"
          d="M 110 100
             C 230 190, 335 195, 425 140
             C 515 85, 635 85, 750 175"/>

  </defs>


  <!-- ================================================= -->
  <!-- SPACE BACKGROUND -->
  <!-- ================================================= -->

  <rect width="850"
        height="280"
        rx="14"
        fill="url(#space)"/>


  <!-- ================================================= -->
  <!-- DISTANT NEBULA -->
  <!-- ================================================= -->

  <ellipse cx="425"
           cy="140"
           rx="300"
           ry="100"
           fill="#2563eb"
           opacity=".035"
           filter="url(#strongGlow)"/>

  <ellipse cx="425"
           cy="140"
           rx="220"
           ry="70"
           fill="#a855f7"
           opacity=".025"
           filter="url(#strongGlow)"/>


  <!-- ================================================= -->
  <!-- STAR FIELD -->
  <!-- ================================================= -->

  <g fill="#ffffff">

    <circle cx="38" cy="35" r="1"/>
    <circle cx="82" cy="72" r=".7"/>
    <circle cx="118" cy="30" r=".8"/>
    <circle cx="156" cy="55" r=".6"/>
    <circle cx="194" cy="28" r="1"/>
    <circle cx="235" cy="44" r=".7"/>
    <circle cx="275" cy="20" r=".6"/>
    <circle cx="318" cy="52" r=".8"/>
    <circle cx="362" cy="27" r=".6"/>
    <circle cx="405" cy="45" r=".8"/>
    <circle cx="450" cy="22" r=".7"/>
    <circle cx="490" cy="43" r=".9"/>
    <circle cx="535" cy="25" r=".6"/>
    <circle cx="580" cy="51" r=".8"/>
    <circle cx="622" cy="30" r=".7"/>
    <circle cx="670" cy="47" r=".9"/>
    <circle cx="710" cy="25" r=".6"/>
    <circle cx="755" cy="52" r=".8"/>
    <circle cx="810" cy="35" r="1"/>

    <circle cx="28" cy="105" r=".7"/>
    <circle cx="65" cy="132" r=".6"/>
    <circle cx="105" cy="110" r=".8"/>
    <circle cx="148" cy="150" r=".7"/>
    <circle cx="205" cy="116" r=".6"/>
    <circle cx="265" cy="132" r=".8"/>
    <circle cx="315" cy="105" r=".6"/>
    <circle cx="360" cy="120" r=".8"/>
    <circle cx="492" cy="115" r=".7"/>
    <circle cx="540" cy="135" r=".6"/>
    <circle cx="595" cy="110" r=".8"/>
    <circle cx="650" cy="145" r=".7"/>
    <circle cx="705" cy="115" r=".6"/>
    <circle cx="770" cy="140" r=".9"/>
    <circle cx="820" cy="105" r=".7"/>

    <circle cx="45" cy="225" r=".8"/>
    <circle cx="90" cy="250" r=".6"/>
    <circle cx="145" cy="215" r=".7"/>
    <circle cx="205" cy="245" r=".9"/>
    <circle cx="260" cy="225" r=".6"/>
    <circle cx="315" cy="255" r=".8"/>
    <circle cx="365" cy="230" r=".6"/>
    <circle cx="490" cy="245" r=".8"/>
    <circle cx="545" cy="220" r=".6"/>
    <circle cx="600" cy="250" r=".8"/>
    <circle cx="655" cy="225" r=".7"/>
    <circle cx="710" cy="250" r=".9"/>
    <circle cx="760" cy="220" r=".6"/>
    <circle cx="815" cy="245" r=".8"/>

  </g>


  <!-- ================================================= -->
  <!-- TWINKLING STARS -->
  <!-- ================================================= -->

  <g fill="#67e8f9">

    <circle cx="130" cy="82" r="1.5">
      <animate attributeName="opacity"
               values=".15;1;.15"
               dur="2.5s"
               repeatCount="indefinite"/>
      <animate attributeName="r"
               values="1;2;1"
               dur="2.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="250" cy="72" r="1.4">
      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="3.1s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="585" cy="78" r="1.6">
      <animate attributeName="opacity"
               values=".1;1;.1"
               dur="2.2s"
               repeatCount="indefinite"/>
      <animate attributeName="r"
               values="1;2.2;1"
               dur="2.2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="720" cy="92" r="1.4">
      <animate attributeName="opacity"
               values=".15;1;.15"
               dur="3.4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="170" cy="200" r="1.5">
      <animate attributeName="opacity"
               values=".1;1;.1"
               dur="2.8s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="680" cy="205" r="1.5">
      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="3.6s"
               repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ================================================= -->
  <!-- ROTATING GALAXY RINGS -->
  <!-- ================================================= -->

  <g fill="none"
     stroke-linecap="round">

    <ellipse cx="425"
             cy="140"
             rx="325"
             ry="78"
             stroke="#22d3ee"
             stroke-width="1"
             opacity=".24"
             stroke-dasharray="2 12">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 425 140"
        to="360 425 140"
        dur="24s"
        repeatCount="indefinite"/>

    </ellipse>


    <ellipse cx="425"
             cy="140"
             rx="275"
             ry="62"
             stroke="#a78bfa"
             stroke-width="1"
             opacity=".27"
             stroke-dasharray="5 9">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360 425 140"
        to="0 425 140"
        dur="18s"
        repeatCount="indefinite"/>

    </ellipse>


    <ellipse cx="425"
             cy="140"
             rx="210"
             ry="45"
             stroke="#38bdf8"
             stroke-width=".8"
             opacity=".28"
             stroke-dasharray="3 8">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 425 140"
        to="360 425 140"
        dur="12s"
        repeatCount="indefinite"/>

    </ellipse>

  </g>


  <!-- ================================================= -->
  <!-- CURVED GALAXY PATHS -->
  <!-- ================================================= -->

  <g fill="none"
     stroke-linecap="round">

    <use href="#orbit1"
         stroke="#22d3ee"
         stroke-width="1"
         opacity=".42"/>

    <use href="#orbit2"
         stroke="#a78bfa"
         stroke-width="1"
         opacity=".38"/>

    <use href="#orbit3"
         stroke="#f59e0b"
         stroke-width=".8"
         opacity=".35"/>

  </g>


  <!-- ================================================= -->
  <!-- MOVING ORBIT PARTICLES -->
  <!-- ================================================= -->

  <g>

    <circle r="2"
            fill="#22d3ee"
            filter="url(#glow)">

      <animateMotion
        dur="7s"
        repeatCount="indefinite"
        path="M 85 151 C 185 62, 330 65, 425 140 C 520 215, 670 215, 765 140"/>

    </circle>


    <circle r="2"
            fill="#a78bfa"
            filter="url(#glow)">

      <animateMotion
        dur="9s"
        begin="1s"
        repeatCount="indefinite"
        path="M 75 180 C 200 235, 335 220, 425 140 C 515 60, 650 55, 780 115"/>

    </circle>


    <circle r="1.8"
            fill="#f59e0b"
            filter="url(#glow)">

      <animateMotion
        dur="6s"
        begin="2s"
        repeatCount="indefinite"
        path="M 110 100 C 230 190, 335 195, 425 140 C 515 85, 635 85, 750 175"/>

    </circle>

  </g>


  <!-- ================================================= -->
  <!-- SHOOTING STAR 1 -->
  <!-- ================================================= -->

  <g>

    <line x1="-80"
          y1="-20"
          x2="-15"
          y2="45"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0">

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="520 185"
        dur="2.2s"
        begin="1s"
        repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values="0;0;1;0"
               dur="2.2s"
               begin="1s"
               repeatCount="indefinite"/>

    </line>

    <line x1="-80"
          y1="-20"
          x2="-15"
          y2="45"
          stroke="#22d3ee"
          stroke-width="1"
          stroke-linecap="round"
          opacity="0">

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="520 185"
        dur="2.2s"
        begin="1s"
        repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values="0;0;.8;0"
               dur="2.2s"
               begin="1s"
               repeatCount="indefinite"/>

    </line>

  </g>


  <!-- ================================================= -->
  <!-- SHOOTING STAR 2 -->
  <!-- ================================================= -->

  <g>

    <line x1="900"
          y1="-30"
          x2="840"
          y2="30"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0">

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="-600 210"
        dur="2.7s"
        begin="4s"
        repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values="0;0;1;0"
               dur="2.7s"
               begin="4s"
               repeatCount="indefinite"/>

    </line>

    <line x1="900"
          y1="-30"
          x2="840"
          y2="30"
          stroke="#a78bfa"
          stroke-width="1"
          stroke-linecap="round"
          opacity="0">

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="-600 210"
        dur="2.7s"
        begin="4s"
        repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values="0;0;.8;0"
               dur="2.7s"
               begin="4s"
               repeatCount="indefinite"/>

    </line>

  </g>


  <!-- ================================================= -->
  <!-- SHOOTING STAR 3 -->
  <!-- ================================================= -->

  <g>

    <line x1="300"
          y1="-40"
          x2="345"
          y2="5"
          stroke="#ffffff"
          stroke-width="1.8"
          stroke-linecap="round"
          opacity="0">

      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="270 230"
        dur="2s"
        begin="7s"
        repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values="0;0;1;0"
               dur="2s"
               begin="7s"
               repeatCount="indefinite"/>

    </line>

  </g>


  <!-- ================================================= -->
  <!-- CENTRAL CORE GLOW -->
  <!-- ================================================= -->

  <circle cx="425"
          cy="140"
          r="45"
          fill="url(#coreGlow)"
          opacity=".3">

    <animate attributeName="r"
             values="35;50;35"
             dur="5s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ================================================= -->
  <!-- CENTRAL ORBIT -->
  <!-- ================================================= -->

  <circle cx="425"
          cy="140"
          r="27"
          fill="none"
          stroke="#22d3ee"
          stroke-width=".8"
          stroke-dasharray="3 5"
          opacity=".7">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 425 140"
      to="360 425 140"
      dur="5s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="425"
          cy="140"
          r="19"
          fill="#0b1628"
          stroke="#38bdf8"
          stroke-width="1.5"
          filter="url(#glow)"/>


  <circle cx="425"
          cy="140"
          r="10"
          fill="#0f172a"
          stroke="#67e8f9"
          stroke-width=".8"/>


  <text x="425"
        y="145"
        text-anchor="middle"
        fill="#e0f2fe"
        font-size="10"
        font-family="monospace"
        font-weight="bold">
    M
  </text>


  <!-- ================================================= -->
  <!-- TECH NODES -->
  <!-- ================================================= -->

  <g font-family="monospace"
     font-size="7">

    <circle cx="295"
            cy="91"
            r="2"
            fill="#3776ab"
            filter="url(#glow)"/>

    <text x="282"
          y="87"
          fill="#60a5fa">
      Python
    </text>


    <circle cx="245"
            cy="164"
            r="2"
            fill="#f59e0b"
            filter="url(#glow)"/>

    <text x="220"
          y="177"
          fill="#fbbf24">
      HTML5
    </text>


    <circle cx="340"
            cy="202"
            r="2"
            fill="#a78bfa"
            filter="url(#glow)"/>

    <text x="324"
          y="216"
          fill="#c4b5fd">
      CSS
    </text>


    <circle cx="510"
            cy="93"
            r="2"
            fill="#22d3ee"
            filter="url(#glow)"/>

    <text x="518"
          y="88"
          fill="#67e8f9">
      C
    </text>


    <circle cx="565"
            cy="175"
            r="2"
            fill="#f59e0b"
            filter="url(#glow)"/>

    <text x="574"
          y="181"
          fill="#fbbf24">
      Docker
    </text>


    <circle cx="650"
            cy="143"
            r="2"
            fill="#a78bfa"
            filter="url(#glow)"/>

    <text x="660"
          y="139"
          fill="#c4b5fd">
      GitHub Actions
    </text>


    <circle cx="720"
            cy="104"
            r="2"
            fill="#22d3ee"
            filter="url(#glow)"/>

    <text x="728"
          y="100"
          fill="#67e8f9">
      MongoDB
    </text>


    <circle cx="165"
            cy="120"
            r="2"
            fill="#f59e0b"
            filter="url(#glow)"/>

    <text x="130"
          y="116"
          fill="#fbbf24">
      Git
    </text>

  </g>


  <!-- ================================================= -->
  <!-- TITLE -->
  <!-- ================================================= -->

  <text x="425"
        y="25"
        text-anchor="middle"
        fill="#e2e8f0"
        font-size="16"
        font-family="sans-serif"
        font-weight="700">
    Mohammed
  </text>


  <text x="425"
        y="39"
        text-anchor="middle"
        fill="#64748b"
        font-size="8"
        font-family="sans-serif">
    Full Stack Developer • Open Source Creator
  </text>


  <!-- ================================================= -->
  <!-- QUOTE -->
  <!-- ================================================= -->

  <text x="425"
        y="265"
        text-anchor="middle"
        fill="#64748b"
        font-size="8"
        font-family="monospace"
        font-style="italic">
    "The best code is the code that empowers others."
  </text>


  <!-- ================================================= -->
  <!-- EXTRA FLOATING PARTICLES -->
  <!-- ================================================= -->

  <g fill="#22d3ee">

    <circle cx="190" cy="95" r="1.5">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;8 -5;0 0"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="610" cy="190" r="1.5">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-8 5;0 0"
        dur="5s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="730" cy="165" r="1.2">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;5 -8;0 0"
        dur="3.5s"
        repeatCount="indefinite"/>
    </circle>

  </g>

</svg>