<svg xmlns="http://www.w3.org/2000/svg"
     width="850"
     height="220"
     viewBox="0 0 850 220">

  <defs>

    <!-- Glow filters -->
    <filter id="purpleGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" in="SourceGraphic" result="blur"/>
      <feFlood flood-color="#a78bfa" flood-opacity=".65" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" in="SourceGraphic" result="blur"/>
      <feFlood flood-color="#00d4ff" flood-opacity=".65" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nebulaGlow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>

    <!-- Card backgrounds -->
    <linearGradient id="purpleCard"
                    x1="0" y1="0"
                    x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2332" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#0f1623" stop-opacity=".95"/>
    </linearGradient>

    <linearGradient id="cyanCard"
                    x1="0" y1="0"
                    x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2332" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#0f1623" stop-opacity=".95"/>
    </linearGradient>

    <!-- Connection -->
    <linearGradient id="connection"
                    x1="0" y1="0"
                    x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity=".5"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity=".5"/>
    </linearGradient>

    <!-- Clips -->
    <clipPath id="leftClip">
      <rect x="56"
            y="55"
            width="340"
            height="140"
            rx="8"/>
    </clipPath>

    <clipPath id="rightClip">
      <rect x="454"
            y="55"
            width="340"
            height="140"
            rx="8"/>
    </clipPath>

  </defs>


  <!-- ============================== -->
  <!-- BACKGROUND -->
  <!-- ============================== -->

  <rect x=".5"
        y=".5"
        width="849"
        height="219"
        rx="12"
        fill="#0f1623"
        stroke="#1a2332"
        stroke-width="1"/>


  <!-- ============================== -->
  <!-- STAR FIELD -->
  <!-- ============================== -->

  <g>

    <circle cx="65" cy="20" r=".8" fill="#94a3b8">
      <animate attributeName="opacity"
               values=".15;.7;.15"
               dur="5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="145" cy="38" r=".6" fill="#a78bfa">
      <animate attributeName="opacity"
               values=".1;.6;.1"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="205" cy="30" r="1" fill="#94a3b8">
      <animate attributeName="opacity"
               values=".2;.8;.2"
               dur="6s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="410" cy="25" r=".7" fill="#a78bfa">
      <animate attributeName="opacity"
               values=".1;.7;.1"
               dur="4.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="450" cy="40" r=".8" fill="#94a3b8">
      <animate attributeName="opacity"
               values=".2;.7;.2"
               dur="5.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="620" cy="25" r=".8" fill="#00d4ff">
      <animate attributeName="opacity"
               values=".15;.8;.15"
               dur="4.8s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="720" cy="40" r=".7" fill="#94a3b8">
      <animate attributeName="opacity"
               values=".1;.6;.1"
               dur="5.2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="805" cy="22" r="1" fill="#a78bfa">
      <animate attributeName="opacity"
               values=".15;.8;.15"
               dur="6s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="30" cy="180" r=".8" fill="#94a3b8">
      <animate attributeName="opacity"
               values=".1;.7;.1"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="420" cy="200" r=".9" fill="#00d4ff">
      <animate attributeName="opacity"
               values=".15;.8;.15"
               dur="5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="825" cy="180" r=".8" fill="#a78bfa">
      <animate attributeName="opacity"
               values=".1;.7;.1"
               dur="4.5s"
               repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ============================== -->
  <!-- GRID -->
  <!-- ============================== -->

  <g stroke="#64748b"
     stroke-width=".5"
     stroke-dasharray="4 8"
     opacity=".08">

    <line x1="20" y1="80" x2="830" y2="80"/>
    <line x1="20" y1="120" x2="830" y2="120"/>
    <line x1="20" y1="160" x2="830" y2="160"/>
    <line x1="20" y1="200" x2="830" y2="200"/>

    <line x1="80" y1="50" x2="80" y2="210"/>
    <line x1="160" y1="50" x2="160" y2="210"/>
    <line x1="240" y1="50" x2="240" y2="210"/>
    <line x1="320" y1="50" x2="320" y2="210"/>
    <line x1="400" y1="50" x2="400" y2="210"/>
    <line x1="480" y1="50" x2="480" y2="210"/>
    <line x1="560" y1="50" x2="560" y2="210"/>
    <line x1="640" y1="50" x2="640" y2="210"/>
    <line x1="720" y1="50" x2="720" y2="210"/>
    <line x1="800" y1="50" x2="800" y2="210"/>

  </g>


  <!-- ============================== -->
  <!-- CORNER MARKS -->
  <!-- ============================== -->

  <g stroke="#64748b"
     stroke-width="1.5"
     opacity=".35"
     fill="none">

    <path d="M5 21V5H21"/>
    <path d="M829 5H845V21"/>
    <path d="M5 199V215H21"/>
    <path d="M829 215H845V199"/>

  </g>


  <!-- ============================== -->
  <!-- HEADER -->
  <!-- ============================== -->

  <text x="30"
        y="38"
        fill="#64748b"
        font-size="11"
        font-family="monospace"
        letter-spacing="3">
    FEATURED SYSTEMS
  </text>

  <circle cx="220"
          cy="34"
          r="3"
          fill="#00d4ff">

    <animate attributeName="opacity"
             values=".3;1;.3"
             dur="2s"
             repeatCount="indefinite"/>

  </circle>

  <text x="820"
        y="38"
        text-anchor="end"
        fill="#64748b"
        font-size="10"
        font-family="monospace">
    SYS 2/2 ONLINE
  </text>


  <!-- ============================== -->
  <!-- CONNECTION -->
  <!-- ============================== -->

  <line x1="226"
        y1="85"
        x2="624"
        y2="85"
        stroke="url(#connection)"
        stroke-width="1"
        stroke-dasharray="6 4"
        opacity=".55">

    <animate attributeName="stroke-dashoffset"
             from="0"
             to="-40"
             dur="2s"
             repeatCount="indefinite"/>

  </line>


  <!-- ============================== -->
  <!-- RENAME BOT CARD -->
  <!-- ============================== -->

  <g>

    <rect x="56"
          y="55"
          width="340"
          height="140"
          rx="8"
          fill="url(#purpleCard)"
          stroke="#1a2332"/>


    <!-- Nebula -->
    <g clip-path="url(#leftClip)">

      <circle cx="155"
              cy="90"
              r="55"
              fill="#a78bfa"
              opacity=".035"
              filter="url(#nebulaGlow)"/>

      <circle cx="300"
              cy="155"
              r="45"
              fill="#a78bfa"
              opacity=".025"
              filter="url(#nebulaGlow)"/>

      <!-- scan -->
      <rect x="56"
            y="55"
            width="340"
            height="2"
            fill="#a78bfa"
            opacity=".12">

        <animateTransform
          attributeName="transform"
          type="translate"
          from="0 0"
          to="0 140"
          dur="6s"
          repeatCount="indefinite"/>

      </rect>

    </g>


    <!-- orbit -->
    <circle cx="226"
            cy="85"
            r="14"
            fill="none"
            stroke="#a78bfa"
            stroke-width=".8"
            stroke-dasharray="4 3"
            opacity=".6">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 226 85"
        to="360 226 85"
        dur="12s"
        repeatCount="indefinite"/>

    </circle>


    <!-- glow -->
    <circle cx="226"
            cy="85"
            r="10"
            fill="#a78bfa"
            opacity=".15"
            filter="url(#purpleGlow)"/>


    <!-- core -->
    <circle cx="226"
            cy="85"
            r="5"
            fill="#a78bfa">

      <animate attributeName="r"
               values="4.5;6;4.5"
               dur="3s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values=".5;1;.5"
               dur="3s"
               repeatCount="indefinite"/>

    </circle>

    <circle cx="226"
            cy="85"
            r="2"
            fill="#ffffff"/>


    <!-- title -->
    <text x="226"
          y="111"
          text-anchor="middle"
          fill="#f1f5f9"
          font-size="14"
          font-weight="700"
          font-family="sans-serif">
      Rename Bot
    </text>


    <!-- description -->
    <text x="226"
          y="129"
          text-anchor="middle"
          fill="#94a3b8"
          font-size="11"
          font-family="sans-serif">
      Telegram file renaming and media
    </text>

    <text x="226"
          y="144"
          text-anchor="middle"
          fill="#94a3b8"
          font-size="11"
          font-family="sans-serif">
      processing automation.
    </text>


    <!-- tag -->
    <rect x="188"
          y="163"
          width="76"
          height="18"
          rx="9"
          fill="#a78bfa"
          opacity=".12"/>

    <text x="226"
          y="175"
          text-anchor="middle"
          fill="#a78bfa"
          font-size="9"
          font-family="monospace">
      Telegram
    </text>

  </g>


  <!-- ============================== -->
  <!-- PREMIUM MOVIE BOT CARD -->
  <!-- ============================== -->

  <g>

    <rect x="454"
          y="55"
          width="340"
          height="140"
          rx="8"
          fill="url(#cyanCard)"
          stroke="#1a2332"/>


    <!-- Nebula -->
    <g clip-path="url(#rightClip)">

      <circle cx="555"
              cy="90"
              r="55"
              fill="#00d4ff"
              opacity=".035"
              filter="url(#nebulaGlow)"/>

      <circle cx="700"
              cy="155"
              r="45"
              fill="#00d4ff"
              opacity=".025"
              filter="url(#nebulaGlow)"/>

      <!-- scan -->
      <rect x="454"
            y="55"
            width="340"
            height="2"
            fill="#00d4ff"
            opacity=".12">

        <animateTransform
          attributeName="transform"
          type="translate"
          from="0 0"
          to="0 140"
          dur="6s"
          repeatCount="indefinite"/>

      </rect>

    </g>


    <!-- orbit -->
    <circle cx="624"
            cy="85"
            r="14"
            fill="none"
            stroke="#00d4ff"
            stroke-width=".8"
            stroke-dasharray="4 3"
            opacity=".6">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360 624 85"
        to="0 624 85"
        dur="12s"
        repeatCount="indefinite"/>

    </circle>


    <!-- glow -->
    <circle cx="624"
            cy="85"
            r="10"
            fill="#00d4ff"
            opacity=".15"
            filter="url(#cyanGlow)"/>


    <!-- core -->
    <circle cx="624"
            cy="85"
            r="5"
            fill="#00d4ff">

      <animate attributeName="r"
               values="4.5;6;4.5"
               dur="3s"
               begin=".5s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values=".5;1;.5"
               dur="3s"
               begin=".5s"
               repeatCount="indefinite"/>

    </circle>

    <circle cx="624"
            cy="85"
            r="2"
            fill="#ffffff"/>


    <!-- title -->
    <text x="624"
          y="111"
          text-anchor="middle"
          fill="#f1f5f9"
          font-size="14"
          font-weight="700"
          font-family="sans-serif">
      Premium Movie Bot
    </text>


    <!-- description -->
    <text x="624"
          y="129"
          text-anchor="middle"
          fill="#94a3b8"
          font-size="11"
          font-family="sans-serif">
      Movie search, indexing and premium
    </text>

    <text x="624"
          y="144"
          text-anchor="middle"
          fill="#94a3b8"
          font-size="11"
          font-family="sans-serif">
      Telegram media delivery system.
    </text>


    <!-- tag -->
    <rect x="585"
          y="163"
          width="78"
          height="18"
          rx="9"
          fill="#00d4ff"
          opacity=".12"/>

    <text x="624"
          y="175"
          text-anchor="middle"
          fill="#00d4ff"
          font-size="9"
          font-family="monospace">
      Python • MongoDB
    </text>

  </g>


  <!-- ============================== -->
  <!-- MOVING PARTICLE -->
  <!-- ============================== -->

  <circle r="2"
          fill="#00d4ff"
          filter="url(#cyanGlow)">

    <animateMotion
      dur="4s"
      repeatCount="indefinite"
      path="M226 85 L624 85"/>

  </circle>


  <!-- ============================== -->
  <!-- GLOBAL SCAN -->
  <!-- ============================== -->

  <rect x="12"
        y="50"
        width="826"
        height="1.5"
        fill="#00d4ff"
        opacity=".08">

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="0 160"
      dur="6s"
      repeatCount="indefinite"/>

  </rect>

</svg>